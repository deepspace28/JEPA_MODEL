[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-model"
version = "0.1.0"
description = "Config-driven JEPA training and evaluation toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JEPA_MODEL contributors" }]
dependencies = [
  "torch>=2.3.0",
  "torchvision>=0.18.0",
  "numpy>=1.26.0",
  "pyyaml>=6.0.1",
  "tqdm>=4.66.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
